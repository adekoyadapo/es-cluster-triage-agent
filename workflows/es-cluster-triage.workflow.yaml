name: ES Cluster Triage Summary
description: Runs Elasticsearch triage queries, asks an agent to summarize the findings, and stores the result. Connect a notification action to deliver alerts.
enabled: true
tags: ["observability", "stack-monitoring", "triage"]
consts:
  default_metrics_pattern: "__METRICS_PATTERN__"
triggers:
  - type: alert
steps:
  - name: metrics_summary
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: |
          FROM {{ event.metrics_index | default: event.index_pattern | default: consts.default_metrics_pattern }}
          | WHERE @timestamp >= NOW() - 1 hour
          | WHERE elasticsearch.cluster.name IS NOT NULL
          | WHERE ("{{ event.cluster_name }}" == "" OR elasticsearch.cluster.name == "{{ event.cluster_name }}")
          | WHERE ("{{ event.node_name }}" == "" OR elasticsearch.node.name == "{{ event.node_name }}")
          | STATS last_seen = MAX(@timestamp), node_count = MAX(elasticsearch.cluster.stats.nodes.count), avg_heap = AVG(elasticsearch.node.stats.jvm.mem.heap.used.pct), max_heap = MAX(elasticsearch.node.stats.jvm.mem.heap.used.pct), max_cpu = MAX(elasticsearch.node.stats.process.cpu.pct), write_rejected = MAX(elasticsearch.node.stats.thread_pool.write.rejected.count), search_rejected = MAX(elasticsearch.node.stats.thread_pool.search.rejected.count), bulk_rejected = MAX(elasticsearch.node.stats.thread_pool.bulk.rejected.count) BY elasticsearch.cluster.name, elasticsearch.node.name
          | SORT max_heap DESC
          | LIMIT 10
  - name: summarize
    type: ai.agent
    agent-id: "__AGENT_ID__"
    with:
      message: |
        Triage the Elasticsearch issue using the workflow-collected evidence below.

        The workflow already queried the metrics source. Your job is to interpret the evidence and return a concise summary.
        If the signal is clearly index-centric or the evidence is still thin, use the available index troubleshooting tools
        to gather additional context before summarizing.
        Do not mention raw query text.
        Focus on the most likely issue, what evidence supports it, what is impacted, and what should be checked next.
        Return a Markdown report with these sections only:
        Summary
        Most likely issue
        Evidence
        Impacted cluster/node/index
        Time window
        Recommended next checks
        Confidence level

        Alert metadata:
        - alert_name: {{ event.name }}
        - alert_reason: {{ event.reason }}
        - cluster_name: {{ event.cluster_name }}
        - node_name: {{ event.node_name }}
        - metrics_index: {{ event.metrics_index | default: event.index_pattern | default: consts.default_metrics_pattern }}

        Metrics evidence:
        {{ steps.metrics_summary.output | json }}
