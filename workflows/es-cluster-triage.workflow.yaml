name: ES Cluster Triage Summary
description: Runs Elasticsearch triage queries, asks an agent to summarize the
  findings, and posts the result to Slack.
enabled: true
tags: ["observability", "stack-monitoring", "triage"]
consts:
  default_metrics_pattern: "__METRICS_PATTERN__"
  slack_connector_id: "__SLACK_CONNECTOR_ID__"
triggers:
  - type: alert
steps:
  - name: metrics_summary
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: |
          FROM {{ event.metrics_index | default: event.index_pattern | default: consts.default_metrics_pattern }}
          | WHERE @timestamp >= NOW() - 1 hour
          | WHERE elasticsearch.cluster.name IS NOT NULL
          | WHERE ("{{ event.cluster_name }}" == "" OR elasticsearch.cluster.name == "{{ event.cluster_name }}")
          | WHERE ("{{ event.node_name }}" == "" OR elasticsearch.node.name == "{{ event.node_name }}")
          | STATS last_seen = MAX(@timestamp), node_count = MAX(elasticsearch.cluster.stats.nodes.count), avg_heap = AVG(elasticsearch.node.stats.jvm.mem.heap.used.pct), max_heap = MAX(elasticsearch.node.stats.jvm.mem.heap.used.pct), max_cpu = MAX(elasticsearch.node.stats.process.cpu.pct), write_rejected = MAX(elasticsearch.node.stats.thread_pool.write.rejected.count), search_rejected = MAX(elasticsearch.node.stats.thread_pool.search.rejected.count), bulk_rejected = MAX(elasticsearch.node.stats.thread_pool.bulk.rejected.count) BY elasticsearch.cluster.name, elasticsearch.node.name
          | SORT max_heap DESC
          | LIMIT 10
  - name: summarize
    type: ai.agent
    agent-id: "__AGENT_ID__"
    with:
      message: |
        Interpret the Elasticsearch monitoring evidence and produce
        an operator-friendly Slack incident summary.

        IMPORTANT FORMATTING RULES:
        - Output Slack-formatted text only
        - Use *bold* section headers
        - Use bullet lists
        - Use triple-backtick code blocks for metrics/evidence
        - Do NOT use markdown headers (#, ##, ###)
        - Do NOT use markdown tables
        - Do NOT use horizontal separators (---)
        - Keep output concise and highly scannable
        - Keep lines short
        - Do not mention raw queries or internal workflow details

        Required sections in this exact order:

        *Summary*
        - Short operational overview
        - State whether impact is active, imminent, or potential

        *Most likely issue*
        - Explain the likely root cause briefly

        *Evidence*
        - Summarize the strongest signals
        - Present node metrics inside a triple-backtick code block
        - Example format:
        ```text
           Node                  Heap Max   CPU   Write Reject
           node-a                87%        4%    0
           node-b                86%        5%    0
        ```

        *Impacted cluster/node/index*
        - Cluster name
        - Affected nodes
        - Mention impacted indices only if evidence exists
        - If unknown, explicitly say "Index impact unknown"

        *Time window*
        - Summarize the observation period

        *Recommended next checks*
        - Provide short actionable investigation steps
        - Prefer operational diagnostics over generic advice

        *Confidence level*
        - Low / Medium / High
        - Brief explanation why

        Alert metadata:
        - alert_name: {{ event.name }}
        - alert_reason: {{ event.reason }}
        - cluster_name: {{ event.cluster_name }}
        - node_name: {{ event.node_name }}
        - index_pattern_override: {{ event.index_pattern }}
        - metrics_index: {{ event.metrics_index | default: event.index_pattern | default: consts.default_metrics_pattern }}

        Metrics evidence:
        {{ steps.metrics_summary.output | json }}
  - name: notify_slack
    type: slack
    connector-id: "{{ consts.slack_connector_id }}"
    with:
      message: |
        High-priority alert: {{ event.name }}.

        *Elasticsearch cluster triage*

        {{ steps.summarize.output.message }}
