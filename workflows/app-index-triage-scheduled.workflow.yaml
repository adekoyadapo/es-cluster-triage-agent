name: Application Index Triage Scheduled
description: Scheduled application index health scan. Produces structured verdict,
  routes on severity, creates/updates a Case, indexes an analytics report.
  Silent (no Slack) when all indices are within normal bounds.
enabled: true
tags: ["observability", "stack-monitoring", "application", "app-index-triage", "scheduled"]
consts:
  default_metrics_pattern: "__METRICS_PATTERN__"
  slack_connector_id: "__SLACK_CONNECTOR_ID__"
  case_owner: "__CASE_OWNER__"
  report_index: "__REPORT_INDEX__"
  fielddata_threshold_bytes: "__FIELDDATA_THRESHOLD_BYTES__"
  segments_threshold: "__SEGMENTS_THRESHOLD__"
settings:
  timeout: "15m"
triggers:
  - type: scheduled
    with:
      every: "__SCHEDULE_INTERVAL__"
steps:
  - name: index_health_scan
    type: elasticsearch.esql.query
    on-failure:
      retry:
        max-attempts: 3
        delay: "5s"
        strategy: exponential
        max-delay: "30s"
      continue: true
    with:
      query: |
        FROM {{ consts.default_metrics_pattern }}
        | WHERE @timestamp >= NOW() - 1 hour
        | WHERE metricset.name == "index"
        | WHERE elasticsearch.index.name IS NOT NULL
        | STATS
            docs_count              = MAX(elasticsearch.index.total.docs.count),
            store_bytes             = MAX(elasticsearch.index.total.store.size_in_bytes),
            index_total             = MAX(elasticsearch.index.total.indexing.index_total),
            index_time_ms           = MAX(elasticsearch.index.total.indexing.index_time_in_millis),
            fielddata_memory_bytes  = MAX(elasticsearch.index.total.fielddata.memory_size_in_bytes),
            segments_count          = MAX(elasticsearch.index.total.segments.count)
          BY elasticsearch.cluster.name, elasticsearch.index.name
        | WHERE fielddata_memory_bytes > {{ consts.fielddata_threshold_bytes }} OR segments_count > {{ consts.segments_threshold }}
        | SORT segments_count DESC, fielddata_memory_bytes DESC
        | LIMIT 20

  - name: triage
    type: ai.agent
    agent-id: "__AGENT_ID__"
    with:
      message: |
        This is a scheduled application index health scan. Analyse the monitoring
        data and produce a structured diagnosis. If all indices look healthy (or
        no data was returned), return severity=healthy.

        Thresholds used in this scan:
        - fielddata > {{ consts.fielddata_threshold_bytes }} bytes
        - segments_count > {{ consts.segments_threshold }}

        Metrics source: {{ consts.default_metrics_pattern }}

        Index health evidence (last 1 hour):
        {{ steps.index_health_scan.output | json }}
      schema:
        type: object
        properties:
          severity:
            type: string
            enum: [critical, high, medium, low, healthy]
            description: |
              Operational severity across all scanned indices. critical = write rejections or
              red status. high = segments >=15, fielddata >0, or indexing time >300 ms on any
              index. medium/low = warning signals. healthy = no issues found.
          confidence:
            type: string
            enum: [High, Medium, Low]
          headline:
            type: string
            description: One-line summary suitable for a case title (max 120 chars).
          root_cause:
            type: string
            description: Primary root-cause hypothesis or "All indices within normal bounds".
          summary_markdown:
            type: string
            description: Full triage report in markdown covering all flagged indices.
          impacted_index:
            type: string
            description: Primary index or data stream with the worst signal (or "none").
          impacted_cluster:
            type: string
            description: Cluster name.
          evidence:
            type: array
            items:
              type: string
          remediation:
            type: array
            items:
              type: string
        required:
          - severity
          - confidence
          - headline
          - root_cause
          - summary_markdown
          - impacted_index
          - impacted_cluster

  - name: find_open_case
    type: cases.findCases
    if: 'steps.triage.output.structured_output.severity : ("critical" or "high")'
    with:
      owner: "{{ consts.case_owner }}"
      status: ["open", "in-progress"]
      tags: ["app-index-auto-triage"]
      search: "{{ steps.triage.output.structured_output.impacted_index }}"
      sortField: "createdAt"
      sortOrder: "desc"
      page: 1
      perPage: 1

  - name: append_to_case
    type: cases.addComment
    if: 'steps.triage.output.structured_output.severity : ("critical" or "high") and steps.find_open_case.output.total > 0'
    with:
      case_id: "{{ steps.find_open_case.output.cases[0].id }}"
      comment: |
        ### Scheduled check — {{ steps.triage.output.structured_output.headline }}

        **Confidence:** {{ steps.triage.output.structured_output.confidence }}
        **Severity:** {{ steps.triage.output.structured_output.severity }}

        {{ steps.triage.output.structured_output.summary_markdown }}

  - name: escalate_case
    type: cases.setSeverity
    if: 'steps.triage.output.structured_output.severity : "critical" and steps.find_open_case.output.total > 0'
    with:
      case_id: "{{ steps.find_open_case.output.cases[0].id }}"
      severity: "critical"

  - name: create_case
    type: cases.createCase
    if: 'steps.triage.output.structured_output.severity : ("critical" or "high") and steps.find_open_case.output.total <= 0'
    with:
      title: "[Index Triage] {{ steps.triage.output.structured_output.headline }}"
      description: |
        {{ steps.triage.output.structured_output.summary_markdown }}

        **Root cause:** {{ steps.triage.output.structured_output.root_cause }}
        **Confidence:** {{ steps.triage.output.structured_output.confidence }}
      owner: "{{ consts.case_owner }}"
      severity: "{{ steps.triage.output.structured_output.severity }}"
      tags: ["app-index-auto-triage", "stack-monitoring", "scheduled"]
      settings:
        syncAlerts: false

  - name: index_report
    type: elasticsearch.index
    on-failure:
      continue: true
    with:
      index: "{{ consts.report_index }}"
      id: "{{ execution.id }}"
      pipeline: "auto-timestamp"
      document:
        workflow: "app-index-triage"
        trigger: "scheduled"
        execution_id: "{{ execution.id }}"
        triage: "${{ steps.triage.output.structured_output }}"
        case_id: "{{ steps.create_case.output.case.id }}"
        case_appended: "{{ steps.find_open_case.output.total > 0 }}"

  - name: route_notification
    type: switch
    expression: "{{ steps.triage.output.structured_output.severity }}"
    cases:
      - match: critical
        steps:
          - name: page_slack_critical
            type: slack
            connector-id: "{{ consts.slack_connector_id }}"
            with:
              message: |
                :rotating_light: *CRITICAL — Scheduled index check*
                *{{ steps.triage.output.structured_output.headline }}*

                *Index:* {{ steps.triage.output.structured_output.impacted_index }}
                *Root cause:* {{ steps.triage.output.structured_output.root_cause }}
                *Confidence:* {{ steps.triage.output.structured_output.confidence }}

                {{ steps.triage.output.structured_output.remediation | json }}

      - match: high
        steps:
          - name: notify_slack_high
            type: slack
            connector-id: "{{ consts.slack_connector_id }}"
            with:
              message: |
                :warning: *HIGH — Scheduled index check*
                *{{ steps.triage.output.structured_output.headline }}*

                *Index:* {{ steps.triage.output.structured_output.impacted_index }}
                *Root cause:* {{ steps.triage.output.structured_output.root_cause }}
                *Confidence:* {{ steps.triage.output.structured_output.confidence }}

    default:
      - name: no_page
        type: console
        with:
          message: "Scheduled index scan complete — severity {{ steps.triage.output.structured_output.severity }}. No notification sent."
