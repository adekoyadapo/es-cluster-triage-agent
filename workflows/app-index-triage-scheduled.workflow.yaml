name: Application Index Triage Scheduled
description: Runs application index-level triage on a schedule, asks an agent to
  summarize the findings, and posts the result to Slack.
enabled: true
tags: ["observability", "stack-monitoring", "application", "app-index-triage", "scheduled"]
consts:
  default_metrics_pattern: "__METRICS_PATTERN__"
  slack_connector_id: "__SLACK_CONNECTOR_ID__"
triggers:
  - type: scheduled
    with:
      every: "__SCHEDULE_INTERVAL__"
steps:
  - name: index_health_scan
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: |
          FROM {{ consts.default_metrics_pattern }}
          | WHERE @timestamp >= NOW() - 1 hour
          | WHERE metricset.name == "index"
          | WHERE elasticsearch.index.name IS NOT NULL
          | STATS
              docs_count = MAX(elasticsearch.index.total.docs.count),
              store_bytes = MAX(elasticsearch.index.total.store.size_in_bytes),
              index_total = MAX(elasticsearch.index.total.indexing.index_total),
              index_time_ms = MAX(elasticsearch.index.total.indexing.index_time_in_millis),
              fielddata_memory_bytes = MAX(elasticsearch.index.total.fielddata.memory_size_in_bytes),
              segments_count = MAX(elasticsearch.index.total.segments.count)
            BY elasticsearch.cluster.name, elasticsearch.index.name
          | WHERE fielddata_memory_bytes > 104857600 OR segments_count > 50
          | SORT segments_count DESC, fielddata_memory_bytes DESC
          | LIMIT 20
  - name: summarize
    type: ai.agent
    agent-id: "__AGENT_ID__"
    with:
      message: |
        This is a scheduled application index health scan. Analyse the monitoring data
        below and produce an operator-friendly Slack status report.

        IMPORTANT FORMATTING RULES:
        - Output Slack-formatted text only
        - Use *bold* section headers
        - Use bullet lists
        - Use triple-backtick code blocks for metrics/evidence
        - Do NOT use markdown headers (#, ##, ###)
        - Do NOT use markdown tables
        - Do NOT use horizontal separators (---)
        - Keep output concise and highly scannable
        - Keep lines short
        - Do not mention raw queries, tool names, or internal workflow details

        Identify any indices with high segment counts (>50 is concerning, >100 is
        critical) or high fielddata memory usage (>100MB). For each index showing
        problems, use the appropriate skill to investigate further.
        If all indices look healthy, confirm that clearly.

        Required sections in this exact order:

        *Summary*
        - Short overview of findings across all scanned indices
        - State whether any index shows active concern or potential risk

        *Indices with issues*
        - For each problematic index:
          - Index name
          - Most likely issue
          - Key evidence (metrics in a triple-backtick code block)
          - Recommended next checks
        - If none, state "No indices with elevated metrics found"

        *Healthy indices*
        - Count only (e.g. "14 indices within normal bounds")

        *Time window*
        - Summarize the observation period

        *Recommended remediation* (per problematic index)
        - If confidence is High: concrete fix steps (e.g. force-merge for high segment counts; disable dynamic mapping for fielddata growth; POST <index>/_ilm/retry for ILM stalls)
        - If confidence is Medium or Low: list the specific diagnostic check needed first

        *Confidence level*
        - Low / Medium / High
        - High only when metric values and monitoring data agree; cap at Medium when they disagree and explain the discrepancy

        Metrics source: {{ consts.default_metrics_pattern }}

        Index health evidence:
        {{ steps.index_health_scan.output | json }}
  - name: notify_slack
    type: slack
    connector-id: "{{ consts.slack_connector_id }}"
    with:
      message: |
        Scheduled application index health check.

        *Application index triage*

        {{ steps.summarize.output.message }}
