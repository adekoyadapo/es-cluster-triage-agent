name: Application Index Triage Summary
description: Triggers index-level triage when a Kibana alert fires, asks an agent
  to summarize the findings, and posts the result to Slack.
enabled: true
tags: ["observability", "stack-monitoring", "application", "app-index-triage"]
consts:
  default_metrics_pattern: "__METRICS_PATTERN__"
  slack_connector_id: "__SLACK_CONNECTOR_ID__"
triggers:
  - type: alert
steps:
  - name: index_metrics_summary
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: |
          FROM {{ event.metrics_index | default: event.index_pattern | default: consts.default_metrics_pattern }}
          | WHERE @timestamp >= NOW() - 1 hour
          | WHERE metricset.name == "index"
          | WHERE elasticsearch.index.name IS NOT NULL
          | WHERE ("{{ event.index_name }}" == "" OR elasticsearch.index.name LIKE "{{ event.index_name }}")
          | WHERE ("{{ event.cluster_name }}" == "" OR elasticsearch.cluster.name == "{{ event.cluster_name }}")
          | STATS
              docs_count = MAX(elasticsearch.index.total.docs.count),
              store_bytes = MAX(elasticsearch.index.total.store.size_in_bytes),
              index_failed = MAX(elasticsearch.index.total.indexing.index_failed),
              index_total = MAX(elasticsearch.index.total.indexing.index_total),
              fielddata_memory_bytes = MAX(elasticsearch.index.total.fielddata.memory_size_in_bytes),
              segments_count = MAX(elasticsearch.index.total.segments.count)
            BY elasticsearch.cluster.name, elasticsearch.index.name
          | SORT index_failed DESC, store_bytes DESC
          | LIMIT 20
  - name: summarize
    type: ai.agent
    agent-id: "__AGENT_ID__"
    with:
      message: |
        Triage the Elasticsearch index issue using the workflow-collected evidence below
        and produce an operator-friendly Slack incident summary.

        IMPORTANT FORMATTING RULES:
        - Output Slack-formatted text only
        - Use *bold* section headers
        - Use bullet lists
        - Use triple-backtick code blocks for metrics/evidence
        - Do NOT use markdown headers (#, ##, ###)
        - Do NOT use markdown tables
        - Do NOT use horizontal separators (---)
        - Keep output concise and highly scannable
        - Keep lines short
        - Do not mention raw queries, tool names, or internal workflow details

        Use the appropriate skill for the symptom described in the alert.

        Required sections in this exact order:

        *Index*
        - Name the affected index or data stream

        *Summary*
        - Short operational overview of the index issue
        - State whether impact is active, imminent, or potential

        *Most likely issue*
        - Explain the likely root cause at the index level

        *Evidence*
        - Summarize the strongest signals
        - Present index metrics inside a triple-backtick code block
        - Example format:
        ```text
           Index                         Docs       Failed   Segments
           logs-app.payments-default     1,204,332  12       87
        ```

        *Impacted scope*
        - Index / shard / node affected
        - If unknown, explicitly say "Scope unclear — further investigation needed"

        *Time window*
        - Summarize the observation period

        *Recommended next checks*
        - Provide short actionable investigation steps
        - Prefer operational diagnostics over generic advice

        *Recommended remediation*
        - If confidence is High: provide concrete, severity-appropriate fix steps grounded in Elastic guidance (e.g. for unassigned shards: run GET _cluster/allocation/explain; for ILM stalls: POST <index>/_ilm/retry; for mapping explosion: set dynamic: strict on the index template)
        - If confidence is Medium or Low: list the specific diagnostic query or Kibana check needed before acting
        - Keep remediation conditional on the measured severity

        *Confidence level*
        - Low / Medium / High
        - High only when metric values, raw data, and the alert signal all agree; cap at Medium when they disagree and explain the discrepancy

        Alert metadata:
        - alert_name: {{ event.name }}
        - alert_reason: {{ event.reason }}
        - cluster_name: {{ event.cluster_name }}
        - index_name: {{ event.index_name }}
        - metrics_index: {{ event.metrics_index | default: event.index_pattern | default: consts.default_metrics_pattern }}

        Index metrics evidence:
        {{ steps.index_metrics_summary.output | json }}
  - name: notify_slack
    type: slack
    connector-id: "{{ consts.slack_connector_id }}"
    with:
      message: |
        High-priority alert: {{ event.name }}.

        *Application index triage*

        {{ steps.summarize.output.message }}
