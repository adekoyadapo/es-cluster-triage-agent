name: ES Cluster Triage Scheduled
description: Runs Elasticsearch triage on a schedule, asks an agent to summarize
  the findings, and posts the result to Slack.
enabled: true
tags: ["observability", "stack-monitoring", "triage", "scheduled"]
consts:
  default_metrics_pattern: "__METRICS_PATTERN__"
  slack_connector_id: "__SLACK_CONNECTOR_ID__"
triggers:
  - type: scheduled
    with:
      every: "__SCHEDULE_INTERVAL__"
steps:
  - name: metrics_summary
    type: elasticsearch.request
    with:
      method: POST
      path: /_query
      body:
        query: |
          FROM {{ consts.default_metrics_pattern }}
          | WHERE @timestamp >= NOW() - 1 hour
          | WHERE elasticsearch.cluster.name IS NOT NULL
          | STATS last_seen = MAX(@timestamp),
                  node_count = MAX(elasticsearch.cluster.stats.nodes.count),
                  avg_heap = AVG(elasticsearch.node.stats.jvm.mem.heap.used.pct),
                  max_heap = MAX(elasticsearch.node.stats.jvm.mem.heap.used.pct),
                  max_cpu = MAX(elasticsearch.node.stats.process.cpu.pct),
                  write_rejected = MAX(elasticsearch.node.stats.thread_pool.write.rejected.count),
                  search_rejected = MAX(elasticsearch.node.stats.thread_pool.search.rejected.count),
                  bulk_rejected = MAX(elasticsearch.node.stats.thread_pool.bulk.rejected.count)
            BY elasticsearch.cluster.name, elasticsearch.node.name
          | SORT max_heap DESC
          | LIMIT 10
  - name: summarize
    type: ai.agent
    agent-id: "__AGENT_ID__"
    with:
      message: |
        This is a scheduled cluster health triage run. Analyse the metrics evidence
        below and produce an operator-friendly Slack status report.

        IMPORTANT FORMATTING RULES:
        - Output Slack-formatted text only
        - Use *bold* section headers
        - Use bullet lists
        - Use triple-backtick code blocks for metrics/evidence
        - Do NOT use markdown headers (#, ##, ###)
        - Do NOT use markdown tables
        - Do NOT use horizontal separators (---)
        - Keep output concise and highly scannable
        - Keep lines short
        - Do not mention raw queries or internal workflow details

        Focus on any anomalies, degraded nodes, elevated heap/CPU, or rejection
        spikes. If the cluster looks healthy, confirm that clearly.

        Required sections in this exact order:

        *Summary*
        - Short operational overview
        - State whether impact is active, imminent, or potential, or that the cluster is healthy

        *Most likely issue* (or "*Cluster looks healthy*" if no concerns)
        - Explain the likely root cause briefly, or confirm normal operation

        *Evidence*
        - Summarize the strongest signals
        - Present node metrics inside a triple-backtick code block

        *Impacted cluster/node/index* (if any)
        - Cluster name and affected nodes
        - If healthy, state "No impact detected"

        *Time window*
        - Summarize the observation period

        *Recommended next checks*
        - Provide short actionable steps if concerns exist
        - If healthy, suggest monitoring cadence

        *Confidence level*
        - Low / Medium / High
        - Brief explanation why

        Metrics source: {{ consts.default_metrics_pattern }}

        Metrics evidence:
        {{ steps.metrics_summary.output | json }}
  - name: notify_slack
    type: slack
    connector-id: "{{ consts.slack_connector_id }}"
    with:
      message: |
        Scheduled cluster health check.

        *Elasticsearch cluster triage*

        {{ steps.summarize.output.message }}
