name: ES Cluster Triage Scheduled
description: Scheduled Elasticsearch cluster triage. Produces structured verdict,
  routes on severity, creates/updates a Case, indexes an analytics report.
  Silent (no Slack) when cluster is healthy.
enabled: true
tags: ["observability", "stack-monitoring", "triage", "scheduled"]
consts:
  default_metrics_pattern: "__METRICS_PATTERN__"
  slack_connector_id: "__SLACK_CONNECTOR_ID__"
  case_owner: "__CASE_OWNER__"
  report_index: "__REPORT_INDEX__"
settings:
  timeout: "15m"
triggers:
  - type: scheduled
    with:
      every: "__SCHEDULE_INTERVAL__"
steps:
  - name: metrics_summary
    type: elasticsearch.esql.query
    on-failure:
      retry:
        max-attempts: 3
        delay: "5s"
        strategy: exponential
        max-delay: "30s"
      continue: true
    with:
      query: |
        FROM {{ consts.default_metrics_pattern }}
        | WHERE @timestamp >= NOW() - 1 hour
        | WHERE elasticsearch.cluster.name IS NOT NULL
        | STATS
            last_seen          = MAX(@timestamp),
            node_count         = MAX(elasticsearch.cluster.stats.nodes.count),
            avg_heap           = AVG(elasticsearch.node.stats.jvm.mem.heap.used.pct),
            max_heap           = MAX(elasticsearch.node.stats.jvm.mem.heap.used.pct),
            max_cpu            = MAX(elasticsearch.node.stats.process.cpu.pct),
            write_rejected     = MAX(elasticsearch.node.stats.thread_pool.write.rejected.count),
            search_rejected    = MAX(elasticsearch.node.stats.thread_pool.search.rejected.count),
            bulk_rejected      = MAX(elasticsearch.node.stats.thread_pool.bulk.rejected.count)
          BY elasticsearch.cluster.name, elasticsearch.node.name
        | SORT max_heap DESC
        | LIMIT 10

  - name: triage
    type: ai.agent
    agent-id: "__AGENT_ID__"
    with:
      message: |
        This is a scheduled cluster health triage run. Analyse the monitoring
        metrics and produce a structured diagnosis. If the cluster looks healthy,
        return severity=healthy.

        Metrics source: {{ consts.default_metrics_pattern }}

        Metrics evidence (last 1 hour):
        {{ steps.metrics_summary.output | json }}
      schema:
        type: object
        properties:
          severity:
            type: string
            enum: [critical, high, medium, low, healthy]
            description: |
              Operational severity. critical = active cluster-threatening issue (red health,
              heap >85%, total rejections >0). high = degraded but cluster is up. medium/low =
              warning signals with no immediate impact. healthy = no issues found.
          confidence:
            type: string
            enum: [High, Medium, Low]
            description: High only when metric values and monitoring data agree.
          headline:
            type: string
            description: One-line summary suitable for a case title (max 120 chars).
          root_cause:
            type: string
            description: Brief root-cause hypothesis or "Cluster healthy — no issues detected".
          summary_markdown:
            type: string
            description: Full triage report in markdown for the case description / comment.
          impacted_cluster:
            type: string
            description: Cluster name (used as the case dedup key).
          evidence:
            type: array
            items:
              type: string
            description: Key metric readings that support the diagnosis.
          remediation:
            type: array
            items:
              type: string
            description: Ordered remediation steps, or empty when healthy.
        required:
          - severity
          - confidence
          - headline
          - root_cause
          - summary_markdown
          - impacted_cluster

  - name: find_open_case
    type: cases.findCases
    if: 'steps.triage.output.structured_output.severity : ("critical" or "high")'
    with:
      owner: "{{ consts.case_owner }}"
      status: ["open", "in-progress"]
      tags: ["es-auto-triage"]
      search: "{{ steps.triage.output.structured_output.impacted_cluster }}"
      sortField: "createdAt"
      sortOrder: "desc"
      page: 1
      perPage: 1

  - name: append_to_case
    type: cases.addComment
    if: 'steps.triage.output.structured_output.severity : ("critical" or "high") and steps.find_open_case.output.total > 0'
    with:
      case_id: "{{ steps.find_open_case.output.cases[0].id }}"
      comment: |
        ### Scheduled check — {{ steps.triage.output.structured_output.headline }}

        **Confidence:** {{ steps.triage.output.structured_output.confidence }}
        **Severity:** {{ steps.triage.output.structured_output.severity }}

        {{ steps.triage.output.structured_output.summary_markdown }}

  - name: escalate_case
    type: cases.setSeverity
    if: 'steps.triage.output.structured_output.severity : "critical" and steps.find_open_case.output.total > 0'
    with:
      case_id: "{{ steps.find_open_case.output.cases[0].id }}"
      severity: "critical"

  - name: create_case
    type: cases.createCase
    if: 'steps.triage.output.structured_output.severity : ("critical" or "high") and steps.find_open_case.output.total <= 0'
    with:
      title: "[ES Triage] {{ steps.triage.output.structured_output.headline }}"
      description: |
        {{ steps.triage.output.structured_output.summary_markdown }}

        **Root cause:** {{ steps.triage.output.structured_output.root_cause }}
        **Confidence:** {{ steps.triage.output.structured_output.confidence }}
      owner: "{{ consts.case_owner }}"
      severity: "{{ steps.triage.output.structured_output.severity }}"
      tags: ["es-auto-triage", "stack-monitoring", "scheduled"]
      settings:
        syncAlerts: false

  - name: index_report
    type: elasticsearch.index
    on-failure:
      continue: true
    with:
      index: "{{ consts.report_index }}"
      id: "{{ execution.id }}"
      document:
        "@timestamp": "{{ execution.startedAt }}"
        workflow: "es-cluster-triage"
        trigger: "scheduled"
        execution_id: "{{ execution.id }}"
        triage: "${{ steps.triage.output.structured_output }}"
        case_id: "{{ steps.create_case.output.case.id }}"
        case_appended: "{{ steps.find_open_case.output.total > 0 }}"

  - name: route_notification
    type: switch
    expression: "{{ steps.triage.output.structured_output.severity }}"
    cases:
      - match: critical
        steps:
          - name: page_slack_critical
            type: slack
            connector-id: "{{ consts.slack_connector_id }}"
            with:
              message: |
                :rotating_light: *CRITICAL — Scheduled cluster check*
                *{{ steps.triage.output.structured_output.headline }}*

                *Root cause:* {{ steps.triage.output.structured_output.root_cause }}
                *Confidence:* {{ steps.triage.output.structured_output.confidence }}

                {{ steps.triage.output.structured_output.remediation | json }}

      - match: high
        steps:
          - name: notify_slack_high
            type: slack
            connector-id: "{{ consts.slack_connector_id }}"
            with:
              message: |
                :warning: *HIGH — Scheduled cluster check*
                *{{ steps.triage.output.structured_output.headline }}*

                *Root cause:* {{ steps.triage.output.structured_output.root_cause }}
                *Confidence:* {{ steps.triage.output.structured_output.confidence }}

    default:
      - name: no_page
        type: console
        with:
          message: "Scheduled check complete — severity {{ steps.triage.output.structured_output.severity }}. No notification sent."
